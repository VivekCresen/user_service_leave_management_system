spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/leave_management_system
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        default_batch_fetch_size: 50
        jdbc:
          fetch_size: 50

  flowable:
    database-schema-update: true
  sql:
    init:
      mode: always
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:viveksinhchavda@gmail.com}
    password: ${MAIL_PASSWORD:drauzuufuzlddfwy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 5
    registry-fetch-interval-seconds: 10
    eureka-server-connect-timeout-seconds: 10
    eureka-server-read-timeout-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

security:
  jwt:
    secret: ${JWT_SECRET:Q3Jlc2VuTGVhdmVNYW5hZ2VtZW50U3lzdGVtSldUU2VjcmV0S2V5Rm9ySFMyNTY=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}

app:
  mail:
    from: ${APP_MAIL_FROM:${MAIL_USERNAME:viveksinhchavda@gmail.com}}
    logo-path: ${APP_MAIL_LOGO_PATH:/home/vivek/Documents/CresenProject/front-end/frontend_leave_management_system/public/assets/logo-6.png}
  frontend:
    forgot-password-url: ${FRONTEND_FORGOT_PASSWORD_URL:http://localhost:4200/forgot-password}
    login-url: ${FRONTEND_LOGIN_URL:http://localhost:4200/login}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
